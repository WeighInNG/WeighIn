[package]
name = "weighin-simulation"
version = "0.0.0"
edition = "2021"

[dependencies]
soroban-env-host = { version = "=28.0.1", features = ["recording_mode", "testutils"] }
soroban-simulation = "=28.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"

[profile.release]
debug = 0

# Keep installed helpers independent of a caller's Soroban Cargo workspace.
[workspace]
