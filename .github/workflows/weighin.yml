##
## weighin.yml — Example workflow for a repo that uses the WeighIn action.
##
## This workflow measures the benchmarks and uploads the report.
## You must also set up a second workflow (weighin-comment.yml)
## to securely post the comment on pull requests from forks.
##

name: WeighIn Benchmark

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    name: Soroban Resource Benchmark
    runs-on: ubuntu-latest
    # Default token permissions (read-only) are sufficient.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - name: Start local Stellar network
        run: |
          docker run --rm -d \
            --name stellar-quickstart \
            -p 8000:8000 \
            stellar/quickstart:latest --local

          echo "Waiting for RPC to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf -X POST -H "Content-Type: application/json" \
                -d '{"jsonrpc":"2.0","id":1,"method":"getNetwork"}' \
                http://localhost:8000/rpc | grep -q "Standalone Network"; then
              echo "RPC is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: RPC did not become healthy in time." >&2
          docker logs stellar-quickstart || true
          exit 1

      - name: Run WeighIn
        uses: mxrtins04/WeighIn@main
        with:
          fixtures-path: weighin-fixtures.json
          config-path: weighin.toml
          rpc-url: http://localhost:8000/rpc
          report-path: weighin-report.md
          metadata-path: pr-metadata.json

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weighin-artifacts
          path: |
            weighin-report.md
            pr-metadata.json
