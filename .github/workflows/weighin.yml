##
## weighin.yml — Example workflow for a repo that uses the WeighIn action.
##
## This workflow measures the benchmarks and uploads the report.
## You must also set up a second workflow (weighin-comment.yml)
## to securely post the comment on pull requests from forks.
##

name: WeighIn Benchmark

on:
  pull_request:
    branches: [main]

jobs:
  benchmark:
    name: Soroban Resource Benchmark
    runs-on: ubuntu-latest
    # Default token permissions (read-only) are sufficient.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.95.0"
          targets: wasm32v1-none

      - name: Install pinned Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/stellar-cli.tar.gz"
          echo "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  $RUNNER_TEMP/stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          tar -xzf "$RUNNER_TEMP/stellar-cli.tar.gz" -C "$RUNNER_TEMP/stellar-cli"
          echo "$RUNNER_TEMP/stellar-cli" >> "$GITHUB_PATH"

      - name: Start local Stellar network
        run: |
          docker run --rm -d \
            --name stellar-quickstart \
            -p 8000:8000 \
            stellar/quickstart@sha256:4c8bad1ef7341205b898f83d9489321da80c7bd74183100fc8e2a39a5938c7d5 --local

          echo "Waiting for RPC to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf -X POST -H "Content-Type: application/json" \
                -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' \
                http://localhost:8000/rpc | grep -q '"status":"healthy"'; then
              echo "RPC is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: RPC did not become healthy in time." >&2
          docker logs stellar-quickstart || true
          exit 1

      - name: Run checkout WeighIn (this repository)
        if: github.repository == 'WeighInNG/WeighIn'
        uses: ./
        with:
          fixtures-path: weighin-fixtures.json
          config-path: weighin.toml
          rpc-url: http://localhost:8000/rpc
          report-path: weighin-report.md
          metadata-path: pr-metadata.json

      - name: Run WeighIn (consumer example)
        if: github.repository != 'WeighInNG/WeighIn'
        uses: WeighInNG/WeighIn@main
        with:
          fixtures-path: weighin-fixtures.json
          config-path: weighin.toml
          rpc-url: http://localhost:8000/rpc
          report-path: weighin-report.md
          metadata-path: pr-metadata.json

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weighin-artifacts
          path: |
            weighin-report.md
            pr-metadata.json
