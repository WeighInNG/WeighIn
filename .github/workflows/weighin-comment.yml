##
## weighin-comment.yml — Example workflow for securely posting the WeighIn comment.
##
## This is the second half of the two-workflow setup. It runs securely in the
## base repository with write permissions to post the comment from the first workflow.
##

name: WeighIn Comment
on:
  workflow_run:
    workflows: ["WeighIn Benchmark"]
    types:
      - completed

jobs:
  post-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: write
      actions: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: weighin-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Comment
        # Immutable public revision verified by PR #13 hosted control/regression/threshold and core CI.
        uses: WeighInNG/WeighIn/comment@bbbe9001bbd375fd6a1ff75be5da2593c86fff20
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-path: weighin-report.md
          metadata-path: pr-metadata.json
