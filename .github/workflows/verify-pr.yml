name: Verify PR

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.95.0'
          targets: wasm32v1-none

      - name: Fetch locked native helper crates
        run: cargo +1.95.0 fetch --locked --manifest-path native/simulation/Cargo.toml

      - name: Fetch locked setup fixture crates
        run: cargo +1.95.0 fetch --locked --manifest-path tests/fixtures/setup-invocations/Cargo.toml

      - name: Install checksum-verified Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/stellar-cli.tar.gz"
          echo "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  $RUNNER_TEMP/stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          tar -xzf "$RUNNER_TEMP/stellar-cli.tar.gz" -C "$RUNNER_TEMP/stellar-cli"
          echo "$RUNNER_TEMP/stellar-cli" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Check license headers
        run: node scripts/check-license-headers.js

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Generate bundle
        run: npm run bundle

      - name: Verify committed bundle matches generated output
        run: git diff --exit-code bundled/
