name: WeighIn CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  verify-build:
    name: Verify Bundle Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - name: Verify no uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Uncommitted changes detected after build. Please run 'npm run bundle' locally and commit the results."
            git status
            git diff
            exit 1
          fi

  benchmark:
    name: Soroban Resource Benchmark
    needs: [lint-and-test, verify-build]
    runs-on: ubuntu-latest
    # Default token permissions are fine (read-only)

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          # Full history needed so git worktree add can fetch the base ref
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          # Pin to the same channel declared in rust-toolchain.toml
          toolchain: "1.95.0"
          targets: wasm32v1-none

      - name: Install Node dependencies
        run: npm ci

      - name: Install pinned Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/stellar-cli.tar.gz"
          echo "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  $RUNNER_TEMP/stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          tar -xzf "$RUNNER_TEMP/stellar-cli.tar.gz" -C "$RUNNER_TEMP/stellar-cli"
          echo "$RUNNER_TEMP/stellar-cli" >> "$GITHUB_PATH"

      - name: Verify reference contract build
        run: |
          stellar --version
          rustc --version
          stellar contract build --manifest-path contract/Cargo.toml --locked --optimize=true
          test -s contract/target/wasm32v1-none/release/contract_test.wasm

      - name: Test measurement adapter and native source
        run: |
          npm test
          npm run test:native
          npm run bundle

      - name: Start local Stellar network
        run: bash scripts/start-local-network.sh

      - name: Run WeighIn
        uses: ./   # use the action from this repo's own checkout
        with:
          fixtures-path: weighin-fixtures.json
          config-path: weighin.toml
          rpc-url: http://localhost:8000/rpc
          report-path: weighin-report.md
          metadata-path: pr-metadata.json

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weighin-artifacts
          path: |
            weighin-report.md
            pr-metadata.json
