name: WeighIn Comment
on:
  workflow_run:
    workflows: ["WeighIn CI"]
    types:
      - completed

jobs:
  post-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: write
      actions: read

    steps:
      - name: Checkout Action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (resolved from @v4)

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (resolved from @v4)
        with:
          name: weighin-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Comment
        uses: ./comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-path: weighin-report.md
          metadata-path: pr-metadata.json
