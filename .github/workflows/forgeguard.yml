name: ForgeGuard

# ForgeGuard scans every open pull request for supply-chain malware patterns
# and publishes commit statuses and review comments.
# See docs/FORGEGUARD.md.
#
# This runs in the base repository and never checks out or executes pull request code:
# PR heads are fetched as git objects and read by scripts/forgeguard/scan-pr.sh from
# the default branch. `pull_request_target` is deliberately avoided.
#
# Note: `workflow_run` and `schedule` only fire once this file exists on the
# default branch.

on:
  # Re-evaluate as soon as CI finishes on a pull request, or a maintainer
  # approves one (relayed by forgeguard-trigger.yml).
  workflow_run:
    workflows: ["WeighIn CI", "ForgeGuard Trigger"]
    types: [completed]
  # Backstop in case an event is missed; GitHub may delay scheduled runs.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Only process this pull request number (blank = all open PRs)"
        required: false
        type: string
      dry_run:
        description: "Report only; do not post statuses, comment or merge"
        required: false
        type: boolean
        default: false

# Deny all permissions by default; the job grants only what it needs.
permissions: {}

concurrency:
  group: forgeguard
  cancel-in-progress: false

jobs:
  guard:
    name: ForgeGuard scan and check
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.event == 'pull_request'
      || github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: write # for repository operations
      pull-requests: write # read reviews, post the scan comment
      statuses: write # publish the ForgeGuard / malware-scan status
      checks: read # read CI results on the PR head
    steps:
      # Check out the DEFAULT BRANCH only. This job runs with write
      # permissions, so it must never check out the pull request head.
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEGUARD_REPO: ${{ github.repository }}
          FORGEGUARD_PR: ${{ inputs.pr }}
          FORGEGUARD_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # Scan-only mode: maintainers merge by hand so Drips issue completion
          # credits and linked issue closures are preserved.
          FORGEGUARD_AUTO_MERGE: "0"
          FORGEGUARD_BRANCHES: "main"
          FORGEGUARD_MERGE_METHOD: squash
          FORGEGUARD_REQUIRED_CHECKS: "Lint, Typecheck, and Test,Verify Bundle Freshness"
          FORGEGUARD_IGNORED_CHECKS: "^(Vercel|Soroban Resource Benchmark)"
        run: bash scripts/forgeguard/merge.sh
