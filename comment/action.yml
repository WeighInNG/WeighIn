name: 'WeighIn Comment'
description: 'Post the WeighIn benchmark report to a pull request'
inputs:
  report-path:
    description: 'Path to the generated Markdown report'
    required: true
  metadata-path:
    description: 'Path to the PR metadata JSON file generated by the main action'
    required: true
  github-token:
    description: 'GitHub token'
    required: true
runs:
  using: 'node24'
  main: '../bundled/comment-action.js'
